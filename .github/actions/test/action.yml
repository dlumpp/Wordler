name: 'Test'
description: 'Test .NET project'
runs:
  using: 'composite'
  steps:
    - name: Test
      run: dotnet test --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"
    - name: Test Report
      uses: dorny/test-reporter@v1
      if: success() || failure()
      with:
        name: xUnit Tests
        path: '**/TestResults/test-results.trx'
        reporter: dotnet-trx
